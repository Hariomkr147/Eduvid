# Lint + unit tests on every push and pull request. No GPU here: the engines' GPU tests and tests/integration
# run on the VM (`make test ARGS=...`, see README).
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eduvid
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: eduvid
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eduvid" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://eduvid:ci@localhost:5432/eduvid
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            common/pyproject.toml
            services/*/requirements.txt
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Python packages
        run: |
          pip install -e "common[service,test]"
          pip install -r services/speech-api/requirements.txt -r services/studio/requirements.txt \
                      -r services/voice-worker/requirements.txt -r services/render-worker/requirements.txt
      - name: Lint
        run: ruff check common db services engines
      - name: Compose secrets check
        run: |
          cp .env.example .env
          docker compose --profile bench config --format json | python3 infra/check_secrets.py
      - name: common
        run: python -m pytest -q common/tests
      - name: speech-api
        working-directory: services/speech-api
        run: python -m pytest -q tests
      - name: studio
        working-directory: services/studio
        env:
          STUDIO_PIPELINE: "0"
        run: python -m pytest -q tests
      - name: voice-worker
        working-directory: services/voice-worker
        run: python -m pytest -q tests
      - name: render-worker
        working-directory: services/render-worker
        run: python -m pytest -q tests
      - name: shell scripts
        run: for f in infra/*.sh infra/backup/*.sh; do bash -n "$f"; done
