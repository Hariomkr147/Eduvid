<body><div class="page wide" id="page"><main class="main">
  <section class="card"><h2><span class="grow">Compare two videos</span></h2>
    <div class="grid"><div class="field"><label for="a">Left</label><select id="a"></select></div><div class="field"><label for="b">Right</label><select id="b"></select></div></div>
    <p class="cap">Play, pause and seek move both videos together. Each side keeps its own sound: the left plays with sound, the right is muted (swap with the speaker buttons).</p>
  </section>
  <div class="cmp" id="cmp"></div>
  <div class="actions" style="justify-content:center"><button class="btn primary" id="pp" type="button">▶ Play both</button><button class="btn" id="rw" type="button">⟲ Restart</button></div>
</main></div>
